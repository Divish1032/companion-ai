[project]
name = "companion-realtime-agent"
version = "0.1.0"
description = "Companion AI realtime agent scaffold."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "livekit>=1.0.0",
    "livekit-api>=1.0.0",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
vosk = [
    "vosk>=0.3.45",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
