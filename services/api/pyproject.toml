[project]
name = "companion-api"
version = "0.1.0"
description = "Companion AI API service scaffold."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "livekit-api>=1.0.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
model-serving = [
    "accelerate>=1.10.0",
    "sentence-transformers[onnx]>=5.1.0",
    "transformers>=4.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
