schema_version: 1
id: assistant_role_integrity_v1
protected: true
tags: [prompt, role, integrity]
sessions:
  - session_key: s1
    turns:
      - turn_key: u1
        role: user
        transcript_status: final
        stt_confidence: 0.97
        offset_ms: 0
        text: "mera naam Rahul hai"
      - turn_key: a1
        role: assistant
        status: final
        offset_ms: 1000
        text: "Namaste Rahul"
storage_expect:
  must_exist_labels: [preferred_name]
  must_not_exist_labels: []
query:
  text: "naam yaad hai?"
  expect:
    must_include_labels: [preferred_name]
    must_not_include_labels: []
    max_packets: 6
    latest_user_authoritative: true
agent_context_expect:
  must_contain_labels: [preferred_name]
  must_contain_text: []
  must_not_contain_labels: []
  must_not_contain_text: []
  max_memory_blocks: 2
  max_context_chars: 900
