schema_version: 1
id: previous_session_recall_v1
protected: true
tags: [recall, previous_session, identity]
sessions:
  - session_key: s1
    turns:
      - turn_key: u1
        role: user
        transcript_status: final
        stt_confidence: 0.99
        offset_ms: 0
        text: "mera naam Rahul hai"
      - turn_key: a1
        role: assistant
        status: final
        offset_ms: 1000
        text: "Achha Rahul, yaad rakhoonga."
  - session_key: s2
    turns:
      - turn_key: u2
        role: user
        transcript_status: final
        stt_confidence: 0.95
        offset_ms: 0
        text: "aaj mausam acha hai"
      - turn_key: a2
        role: assistant
        status: final
        offset_ms: 1000
        text: "Haan, bahut acha mausam hai."
  - session_key: s3
    turns:
      - turn_key: u3
        role: user
        transcript_status: final
        stt_confidence: 0.96
        offset_ms: 0
        text: "mujhe chai pasand hai"
      - turn_key: a3
        role: assistant
        status: final
        offset_ms: 1000
        text: "Theek hai, chai yaad rakhoonga."
storage_expect:
  must_exist_labels: [preferred_name, safe_preference]
  must_not_exist_labels: []
query:
  text: "mera naam kya hai?"
  expect:
    must_include_labels: [preferred_name]
    must_not_include_labels: []
    max_packets: 6
    latest_user_authoritative: true
agent_context_expect:
  must_contain_labels: [preferred_name]
  must_contain_text: []
  must_not_contain_labels: []
  must_not_contain_text: []
  max_memory_blocks: 2
  max_context_chars: 900
