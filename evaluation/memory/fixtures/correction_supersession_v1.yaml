schema_version: 1
id: correction_supersession_v1
protected: true
tags: [correction, supersession, name]
sessions:
  - session_key: s1
    turns:
      - turn_key: u1
        role: user
        transcript_status: final
        stt_confidence: 0.90
        offset_ms: 0
        text: "mera naam Rahul hai"
      - turn_key: a1
        role: assistant
        status: final
        offset_ms: 1000
        text: "Achha Rahul, yaad rakhoonga."
      - turn_key: u2
        role: user
        transcript_status: final
        stt_confidence: 0.95
        offset_ms: 2000
        text: "mera naam Amit hai"
      - turn_key: a2
        role: assistant
        status: final
        offset_ms: 3000
        text: "Achha Amit, yaad rakhoonga."
storage_expect:
  must_exist_labels: [preferred_name]
  must_not_exist_labels: []
query:
  text: "mera naam kya hai?"
  expect:
    must_include_labels: [preferred_name]
    must_not_include_labels: []
    max_packets: 4
    latest_user_authoritative: true
agent_context_expect:
  must_contain_labels: [preferred_name]
  must_contain_text: []
  must_not_contain_labels: []
  must_not_contain_text: []
  max_memory_blocks: 2
  max_context_chars: 900
