services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file:
      - ../services/api/.env.example
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  realtime-agent:
    build:
      context: ..
      dockerfile: services/realtime-agent/Dockerfile
    env_file:
      - ../services/realtime-agent/.env.example
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
