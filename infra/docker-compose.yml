services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    profiles: ["telemetry"]
    environment:
      POSTGRES_DB: companion_telemetry
      POSTGRES_USER: companion_telemetry
      POSTGRES_PASSWORD: ${POSTGRES_TELEMETRY_PASSWORD:-local-dev-only}
    volumes:
      - telemetry-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion_telemetry -d companion_telemetry"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.9
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      # Required for a physical device on the same LAN: Docker otherwise
      # advertises its bridge address or a public STUN address to WebRTC peers.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file:
      - ../services/api/.env.example
    environment:
      API_LIVEKIT_URL: ${API_LIVEKIT_URL:-ws://localhost:7880}
      API_LIVEKIT_API_KEY: ${API_LIVEKIT_API_KEY:-devkey}
      API_LIVEKIT_API_SECRET: ${API_LIVEKIT_API_SECRET:-secret}
      API_AGENT_ASSIGNMENT_URL: http://realtime-agent:8001/v1/agent/assign
      API_ENABLE_MEMORY_EMBEDDINGS: ${API_ENABLE_MEMORY_EMBEDDINGS:-true}
      API_MEMORY_EMBEDDING_MODEL: ${API_MEMORY_EMBEDDING_MODEL:-google/embeddinggemma-300m}
      API_MEMORY_EMBEDDING_REVISION: ${API_MEMORY_EMBEDDING_REVISION:-57c266a740f537b4dc058e1b0cda161fd15afa75}
      API_MEMORY_EMBEDDING_DIMENSION: ${API_MEMORY_EMBEDDING_DIMENSION:-768}
      API_MEMORY_EMBEDDING_BACKEND: ${API_MEMORY_EMBEDDING_BACKEND:-onnx}
      API_MEMORY_EMBEDDING_MODEL_PATH: ${API_MEMORY_EMBEDDING_MODEL_PATH:-/models/huggingface/embeddinggemma-onnx-fp32-r57c266a7}
      API_EMBEDDING_TIMEOUT_SECONDS: ${API_EMBEDDING_TIMEOUT_SECONDS:-1.0}
      API_ENABLE_MEMORY_RERANKER: ${API_ENABLE_MEMORY_RERANKER:-false}
      API_MEMORY_RERANKER_MODEL: ${API_MEMORY_RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      API_RERANKER_TIMEOUT_SECONDS: ${API_RERANKER_TIMEOUT_SECONDS:-0.12}
      API_ENABLE_MEMORY_PLANNER: ${API_ENABLE_MEMORY_PLANNER:-false}
      API_MEMORY_PLANNER_MODEL: ${API_MEMORY_PLANNER_MODEL:-Qwen/Qwen3-0.6B}
      API_PLANNER_TIMEOUT_SECONDS: ${API_PLANNER_TIMEOUT_SECONDS:-0.1}
      API_ENABLE_MEMORY_EXTRACTION: ${API_ENABLE_MEMORY_EXTRACTION:-false}
      API_MEMORY_EXTRACTION_BASE_URL: ${API_MEMORY_EXTRACTION_BASE_URL:-}
      API_MEMORY_EXTRACTION_API_KEY: ${API_MEMORY_EXTRACTION_API_KEY:-}
      API_MEMORY_EXTRACTION_MODEL: ${API_MEMORY_EXTRACTION_MODEL:-}
      API_MEMORY_EXTRACTION_TIMEOUT_SECONDS: ${API_MEMORY_EXTRACTION_TIMEOUT_SECONDS:-20}
      API_MEMORY_JUDGE_INPUT_MICRO_INR_PER_MILLION_TOKENS: ${API_MEMORY_JUDGE_INPUT_MICRO_INR_PER_MILLION_TOKENS:-0}
      API_MEMORY_JUDGE_OUTPUT_MICRO_INR_PER_MILLION_TOKENS: ${API_MEMORY_JUDGE_OUTPUT_MICRO_INR_PER_MILLION_TOKENS:-0}
      API_TELEMETRY_STORE_PATH: ${API_TELEMETRY_STORE_PATH:-/data/companion_telemetry.sqlite}
      API_TELEMETRY_INGEST_TOKEN: ${API_TELEMETRY_INGEST_TOKEN:-}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
      - memory-model-cache:/models/huggingface
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  realtime-agent:
    build:
      context: ..
      dockerfile: services/realtime-agent/Dockerfile
    env_file:
      - ../services/realtime-agent/.env.example
      - ../.env
    environment:
      AGENT_LIVEKIT_URL: ws://livekit:7880
      AGENT_LIVEKIT_API_KEY: ${AGENT_LIVEKIT_API_KEY:-devkey}
      AGENT_LIVEKIT_API_SECRET: ${AGENT_LIVEKIT_API_SECRET:-secret}
      AGENT_VOSK_MODEL_PATH: /models/vosk-model-small-hi-0.22
      AGENT_ENABLE_METRICS_INGEST: ${AGENT_ENABLE_METRICS_INGEST:-false}
      AGENT_METRICS_INGEST_URL: http://api:8000/v1/telemetry/ingest
      AGENT_METRICS_INGEST_TOKEN: ${API_TELEMETRY_INGEST_TOKEN:-}
    ports:
      - "8001:8001"
    volumes:
      - ../models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

volumes:
  redis-data:
  api-data:
  memory-model-cache:
  telemetry-postgres-data:
